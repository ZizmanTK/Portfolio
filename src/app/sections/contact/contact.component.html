@let ui = i18n.ui();
<section id="contact" class="section section--band" aria-labelledby="contact-title">
  <div class="container">
    <h2 id="contact-title" class="section-title" data-n="06">{{ ui.sections.contact }}</h2>
    <div class="panel">
      <div class="panel__main">
        <p class="intro">{{ ui.contactIntro }}</p>
        <div class="email">
          <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
          <button type="button" class="btn btn--sm" (click)="copyEmail()" aria-live="polite">
            <app-icon [name]="copied() ? 'check' : 'copy'" [size]="15" /> {{ copied() ? ui.copied : ui.copy }}
          </button>
        </div>
        <ul role="list" class="links">
          @for (s of socials; track s.id) {
            <li>
              <a class="btn btn--sm btn--ghost" [href]="s.url" target="_blank" rel="noopener me">
                <app-icon [name]="s.id" [size]="16" /> {{ s.label }}
              </a>
            </li>
          }
        </ul>
      </div>
      <div class="panel__cv">
        <a class="btn btn--signal" [href]="i18n.t(profile.resume)" download>
          <app-icon name="download" [size]="18" /> {{ ui.downloadCv }} (PDF)
        </a>
        <a class="link small" [href]="otherResume()" download>{{ ui.otherCv }}</a>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <app-logo [size]="20" />
      <p class="muted">© {{ year }} {{ profile.name }} · {{ ui.builtWith }}</p>
    </div>
    <div class="footer__links">
      <a class="muted link" href="https://github.com/ZizmanTK/Portfolio" target="_blank" rel="noopener">{{ ui.viewSource }}</a>
      <a class="muted link" [routerLink]="i18n.otherLangPath()">{{ ui.switchLang }}</a>
      <a class="icon-btn" [routerLink]="homePath()" fragment="top" [attr.aria-label]="ui.backToTop" [title]="ui.backToTop">
        <app-icon name="arrowUp" [size]="16" />
      </a>
    </div>
  </div>
</footer>

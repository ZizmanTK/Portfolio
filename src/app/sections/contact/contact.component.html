@let ui = i18n.ui();
<section id="contact" class="section" aria-labelledby="contact-title">
  <div class="container split">
    <h2 id="contact-title" class="section-title">{{ ui.sections.contact }}</h2>

    <div class="body">
      <p class="intro">{{ ui.contactIntro }}</p>

      <p class="email">
        <a [href]="'mailto:' + profile.email"><mark>{{ profile.email }}</mark></a>
      </p>
      <button type="button" class="copy link" (click)="copyEmail()" aria-live="polite">
        {{ copied() ? ui.copied + ' ✓' : ui.copy }}
      </button>

      <ul role="list" class="links">
        @for (s of socials; track s.id) {
          <li>
            <a class="link" [href]="s.url" target="_blank" rel="noopener me">{{ s.label }} ↗</a>
          </li>
        }
      </ul>

      <div class="cv">
        <a class="btn btn--primary" [href]="i18n.t(profile.resume)" download>
          <app-icon name="download" [size]="18" /> {{ ui.downloadCv }} (PDF)
        </a>
        <a class="link small" [href]="otherResume()" download>{{ ui.otherCv }}</a>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <app-logo [size]="20" />
      <p class="muted">© {{ year }} {{ profile.name }} · {{ ui.builtWith }}</p>
    </div>
    <div class="footer__links">
      <a class="muted link" href="https://github.com/ZizmanTK/Portfolio" target="_blank" rel="noopener">{{ ui.viewSource }}</a>
      <a class="muted link" [routerLink]="i18n.otherLangPath()">{{ ui.switchLang }}</a>
      <a class="icon-btn" [routerLink]="homePath()" fragment="top" [attr.aria-label]="ui.backToTop" [title]="ui.backToTop">
        <app-icon name="arrowUp" [size]="16" />
      </a>
    </div>
  </div>
</footer>

@let ui = i18n.ui();
<div class="bar container">
  <a class="brand" [routerLink]="homePath()" fragment="top" (click)="menuOpen.set(false)" aria-label="Abdoul Aziz Maazou — home">
    <app-logo [size]="26" />
    <span class="brand__name mono">abdoul-aziz<span class="muted">.maazou</span></span>
  </a>

  <nav class="nav" [attr.aria-label]="ui.menu">
    <ul role="list" class="nav__list">
      @for (link of links(); track link.id; let i = $index) {
        <li>
          <a
            class="nav__link mono"
            [class.is-active]="active() === link.id"
            [routerLink]="homePath()"
            [fragment]="link.id"
            (click)="menuOpen.set(false)"
            ><span class="nav__idx">0{{ i + 1 }}</span>{{ link.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <div class="actions">
    <a
      class="icon-btn"
      [routerLink]="i18n.otherLangPath()"
      [attr.hreflang]="i18n.lang() === 'en' ? 'fr' : 'en'"
      [attr.aria-label]="ui.switchLang"
      [title]="ui.switchLang"
      >{{ ui.langShort }}</a
    >
    <button type="button" class="icon-btn" (click)="theme.toggle()" [attr.aria-label]="ui.toggleTheme" [title]="ui.toggleTheme">
      <app-icon class="only-light" name="moon" [size]="16" />
      <app-icon class="only-dark" name="sun" [size]="16" />
    </button>
    <a class="btn btn--signal btn--sm cv" [href]="i18n.t(profile.resume)" download [attr.aria-label]="ui.downloadCv">
      <app-icon name="download" [size]="15" />
      <span>{{ ui.cv }}</span>
    </a>
    <button
      type="button"
      class="icon-btn menu-btn"
      (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? ui.close : ui.menu"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="16" />
    </button>
  </div>
</div>

<div id="mobile-menu" class="sheet" [class.is-open]="menuOpen()" [attr.aria-hidden]="!menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <ul role="list" class="container sheet__list">
    @for (link of links(); track link.id; let i = $index) {
      <li>
        <a class="sheet__link" [routerLink]="homePath()" [fragment]="link.id" (click)="menuOpen.set(false)">
          <span class="mono signal">0{{ i + 1 }}</span> ~/{{ link.label }}
        </a>
      </li>
    }
  </ul>
</div>

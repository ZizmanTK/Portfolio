    <!-- Before the first paint: JS is on (html.js), and unless motion is reduced the day is animated (html.motion), so the
         page does not first paint its static version. If the app never starts (the bundle failed), the static version
         comes back after the load. -->
    <script>
      (function (r) {
        r.classList.replace('no-js', 'js');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('motion');
        addEventListener('load', function () {
          setTimeout(function () { if (!r.classList.contains('day-on')) r.classList.remove('motion'); }, 8000);
        });
      })(document.documentElement);
    </script>
